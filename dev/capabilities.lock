delete   cmd_write.c    cmd_collection               SQL "DELETE FROM"  x2
delete   cmd_write.c    cmd_item                     SQL "DELETE FROM"
delete   cmd_write.c    cmd_link                     SQL "DELETE FROM"
delete   cmd_write.c    cmd_reminder                 SQL "DELETE FROM"
delete   db.c           backup                       g_unlink
