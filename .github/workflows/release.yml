# Keeps one pull request open that applies every pending changeset through the
# changesets CLI: package.json's version, manifest.json's (copied by
# `pnpm release`), the new CHANGELOG.md section, and the consumed files.
# Merging it is the release. Nothing here pushes to main or publishes a package.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" must be on, or opening the pull request is refused. A pull request
# opened with GITHUB_TOKEN starts no other workflow, so check.yml and cli.yml do
# not run on it until someone pushes to the branch or closes and reopens it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    name: Open the version pull request
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install the changesets CLI
        run: pnpm install --frozen-lockfile

      # With no changesets pending there is nothing to version, and the action
      # opens nothing. Without a publish command it never publishes.
      - name: Open or update the version pull request
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: "chore: bump version"
          commit: "chore: bump version"
        env:
          GITHUB_TOKEN: ${{ github.token }}
